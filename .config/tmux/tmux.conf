# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'sandudorogan/tmux-pane-tree'

# tmux-pane-tree: use prefix-e/E instead of default t/T
set -g @tmux_pane_tree_toggle_key e
set -g @tmux_pane_tree_focus_key E
set -g @tmux_pane_tree_install_agent_hooks 1

# tmux-pane-tree: gruvbox-dark palette for the sidebar tree
set -g @tmux_pane_tree_color_session '#fe8019'
set -g @tmux_pane_tree_color_window '#fabd2f'
set -g @tmux_pane_tree_color_pane '#8ec07c'

# tmux-pane-tree: highlight the truly active window/pane with a bold bar
set -g @tmux_pane_tree_color_active_fg '#282828'
set -g @tmux_pane_tree_color_active_bg '#fe8019'

# Bind reload config file to prefix r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Optional: dark or light
set -g @gruvbox 'dark'

# Set true color and coloured undercurl (for LSP diagnostics)
set -g default-terminal "tmux-256color"
set -g terminal-features ",*:RGB:usstyle"

# Kill the ~500ms <Esc> lag in nvim
set -sg escape-time 10

# Bigger scrollback than the 2000-line default
set -g history-limit 50000

# Forward focus events to applications inside panes
set -g focus-events on

# Set the status bar to be on top
set -g status-position top

# Set prefix key to NOT be ctrl-b but rather ctrl-Space 
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Always start new windows in the home directory
#set-option -g default-directory "$HOME"

# Always start new windows in the directory I came from
bind c new-window -c "#{pane_current_path}"

# Bind Option-o (or Alt-o) to move between panes
bind -n M-o select-pane -t :.+

# Bind Option-j to split pane horizontally and Option-l to split vertically
bind -n M-j split-window
bind -n M-l split-window -h

# Don't rename windows automatically
set-option -g allow-rename off

# Automatically renumber panes when I close a tab
set -g renumber-windows on

# Use vim copy mode
set -g mode-keys vi
set -g status-keys vi

# Bind Option-k to immediately start scrolling (in copy mode) - and then jump half a page up
# Pressing Option-k repeatedly keeps on moving one page up
# bind -n M-k copy-mode \; send-keys -X halfpage-up

# Bind Option-k to start copy mode
bind -n M-k copy-mode

#
# Initialize TPM (must be at bottom)
run '~/.config/tmux/plugins/tpm/tpm'

## Override theme
# Make active border pop a bit more
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#fe8019'

set -g pane-border-lines heavy

# Bell notifications
set -g monitor-bell on
set -g bell-action any
set -g window-status-bell-style default
set -g window-status-format "#[bg=colour239 fg=colour237 noitalics]#{?window_bell_flag,#[fg=colour214 bold],#[fg=colour223]} #I  #W#{?window_bell_flag, ⚑,} #[bg=colour237 fg=colour239 noitalics]"

# Highlight bell-flagged sessions/windows in the leader-w / leader-s tree pickers.
# session_bell_flag aggregates across all windows in the session, so a collapsed
# session row lights up even if the bell isn't on its current/last-focused window.
set -g @tree_bell_format "#{?session_format,#{?session_bell_flag,#[fg=colour214 bold]⚡ ,}#{session_name}: #{session_windows} windows#{?session_attached, (attached),}#[default],window_format,#{?window_bell_flag,#[fg=colour214 bold]⚡ ,}#{window_index}: #{window_name}#{window_flags}#[default],#{pane_index}: #{pane_current_command}}"
bind w choose-tree -Zw -F "#{T:@tree_bell_format}"
bind s choose-tree -Zs -F "#{T:@tree_bell_format}"
